version: '3.8'

services:
  ultimatepdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultimatepdf-container
    image: ultimatepdf:latest
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - ./src:/src
    healthcheck:
      test: ["CMD", "echo", "Container is running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - ultimatepdf-network

networks:
  ultimatepdf-network:
    driver: bridge
